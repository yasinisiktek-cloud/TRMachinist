name: Bug report
description: Report a reproducible TRMachinist problem
title: "[Bug]: "
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Prefer synthetic NC/data that can be shared publicly. Do not upload customer or proprietary files.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit/version
  - type: input
    id: environment
    attributes:
      label: Windows / .NET / hardware
  - type: textarea
    id: controller
    attributes:
      label: Controller and machine assumptions
