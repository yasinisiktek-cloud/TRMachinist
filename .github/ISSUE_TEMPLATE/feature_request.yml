name: Feature request
description: Propose a simulation, controller, kinematics or tooling improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Engineering problem
      description: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: textarea
    id: validation
    attributes:
      label: How could it be validated?
      description: Describe synthetic/public fixtures, numeric invariants or regression tests.
