name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\TRMachinist.sln

      - name: Build Release
        run: dotnet build .\TRMachinist.sln -c Release --no-restore

      - name: Run smoke tests
        run: dotnet run --project .\src\TRMachinist.SmokeTests\TRMachinist.SmokeTests.csproj -c Release --no-build
